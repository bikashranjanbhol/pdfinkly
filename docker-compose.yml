# Local services for development: Postgres, plus optional MinIO for testing the S3 driver.
#   docker compose up -d            → Postgres only is enough with STORAGE_DRIVER=local
#   docker compose --profile s3 up -d  → also MinIO (console on http://localhost:9001, minioadmin/minioadmin)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdfinkly
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  minio:
    image: minio/minio
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-setup:
    image: minio/mc
    profiles: [s3]
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/pdfinkly;
      "

volumes:
  pgdata:
  miniodata:
